[package]
name              = "rust-lexer"
edition.workspace = true

[lints]
workspace = true

[dependencies]
memchr             = { version = "2.8.1" }
unicode-ident      = { version = "1.0.24" }
unicode-properties = { version = "0.1.4" }

[dev-dependencies]
criterion   = { version = "0.8.2" }
expect-test = { version = "1.5.1" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
criterion-perf-events = { version = "0.4.0" }

[target.'cfg(target_os = "macos")'.dev-dependencies]
darwin-kperf-criterion = { version = "0.1.0" }

[[bench]]
name    = "bench"
harness = false
